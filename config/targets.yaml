# ---------------------------------------------------------------------------
# Machine-checkable contract for CI (opt-in; safe to delete if unused).
# ---------------------------------------------------------------------------
json_schema_ref: "./schema/bounty-programs.schema.json"
ci_gates:
  - id: "no_quarantined_assets_in_production"
    severity: "error"
    applies_to: "env:production"
  - id: "all_domains_match_validation_asset_rules_domain"
    severity: "error"
  - id: "no_denied_cidr_in_active_scope"
    severity: "error"
  - id: "scope_checksum_present"
    severity: "warning"