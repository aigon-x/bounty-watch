<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Bounty Watch logo">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#004C99"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#E6B800"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0066CC" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#primaryGradient)" filter="url(#shadow)"/>
  
  <!-- Shield shape -->
  <path d="M64 18 C38.5 18 18 38.5 18 64 C18 78.5 32 94 48 106 L64 118 L80 106 C96 94 110 78.5 110 64 C110 38.5 89.5 18 64 18 Z" 
        fill="none" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bug/antenna icon inside shield -->
  <g fill="none" stroke="url(#accentGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <ellipse cx="64" cy="70" rx="10" ry="14"/>
    <!-- Head -->
    <circle cx="64" cy="48" r="8"/>
    <!-- Antennas -->
    <path d="M56 40 Q50 30 56 24" />
    <path d="M72 40 Q78 30 72 24" />
    <!-- Antenna tips -->
    <circle cx="56" cy="24" r="2" fill="url(#accentGradient)"/>
    <circle cx="72" cy="24" r="2" fill="url(#accentGradient)"/>
    <!-- Eyes -->
    <circle cx="60" cy="46" r="1.5" fill="url(#primaryGradient)"/>
    <circle cx="68" cy="46" r="1.5" fill="url(#primaryGradient)"/>
    <!-- Legs -->
    <path d="M54 62 L46 68" />
    <path d="M74 62 L82 68" />
    <path d="M54 76 L46 84" />
    <path d="M74 76 L82 84" />
    <path d="M54 90 L46 96" />
    <path d="M74 90 L82 96" />
  </g>
  
  <!-- Pulse ring for "watch" concept -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="#FFCC00" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6">
    <animate attributeName="r" values="48;56;48" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>