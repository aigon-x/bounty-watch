<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-primary: #0066CC;
      --color-primary-hover: #0052A3;
      --color-secondary: #004C99;
      --color-accent: #FFCC00;
      --color-background: #F5F7FA;
      --color-surface: #FFFFFF;
      --color-text: #333333;
      --color-text-muted: #777777;
      --color-border: #E1E5EB;
      --color-success: #1A7F37;
      --color-danger: #C42B1C;
      --color-focus: #0066CC;
      --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --container-max: 1200px;
      --gutter: 24px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
      --transition: 0.2s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body { font-family: var(--font-family); font-size: 1rem; line-height: 1.6; color: var(--color-text); background: var(--color-background); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    .skip-link { position: absolute; top: -40px; left: 0; background: var(--color-primary); color: #fff; padding: 8px 16px; z-index: 100; transition: top var(--transition); }
    .skip-link:focus { top: 0; }

    .container { width: 100%; max-width: var(--container-max); margin: 0 auto; padding: 0 var(--gutter); }

    /* Header */
    header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.95); backdrop-filter: saturate(180%) blur(12px); border-bottom: 1px solid var(--color-border); }
    header .header__inner { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: var(--gutter); }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--color-text); font-weight: 700; font-size: 1.25rem; }
    .logo__icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1rem; }
    .nav__link { color: var(--color-text-muted); text-decoration: none; font-weight: 500; font-size: 0.9375rem; transition: color var(--transition); }
    .nav__link:hover, .nav__link:focus-visible { color: var(--color-primary); }

    /* Hero */
    .hero { padding: clamp(48px, 8vw, 80px) 0; background: linear-gradient(180deg, var(--color-surface) 0%, var(--color-background) 100%); border-bottom: 1px solid var(--color-border); }
    .hero__content { text-align: center; max-width: 720px; margin: 0 auto; }
    .hero__badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: var(--color-primary); color: #fff; border-radius: 999px; font-size: 0.8125rem; font-weight: 600; margin-bottom: 20px; }
    .hero__badge::before { content: ""; width: 8px; height: 8px; background: var(--color-accent); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .hero__title { font-size: clamp(2rem, 5vw, 2.5rem); font-weight: 700; line-height: 1.2; color: var(--color-text); margin-bottom: 16px; }
    .hero__subtitle { font-size: clamp(1rem, 2vw, 1.125rem); color: var(--color-text-muted); margin-bottom: 28px; max-width: 560px; margin-left: auto; margin-right: auto; }
    .hero__stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-bottom: 32px; }
    .stat { display: flex; flex-direction: column; align-items: center; padding: 16px 24px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); min-width: 120px; box-shadow: var(--shadow-sm); }
    .stat__value { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; color: var(--color-primary); line-height: 1; }
    .stat__label { font-size: 0.8125rem; color: var(--color-text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .hero__cta { display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; background: var(--color-primary); color: #fff; border-radius: var(--radius-md); font-weight: 600; font-size: 1rem; text-decoration: none; transition: background var(--transition), transform var(--transition), box-shadow var(--transition); box-shadow: var(--shadow-md); }
    .hero__cta:hover { background: var(--color-primary-hover); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .hero__cta:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; }

    /* Section */
    .section { padding: clamp(48px, 6vw, 72px) 0; }
    .section__header { text-align: center; margin-bottom: 40px; }
    .section__title { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; color: var(--color-text); margin-bottom: 8px; }
    .section__description { color: var(--color-text-muted); font-size: 1rem; }

    /* Cards Grid */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--gutter); }
    .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 28px; transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition); }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--color-primary); }
    .card__header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .card__program { display: flex; align-items: center; gap: 12px; }
    .card__avatar { width: 48px; height: 48px; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 1.125rem; flex-shrink: 0; }
    .card__info { flex: 1; min-width: 0; }
    .card__name { font-size: 1.125rem; font-weight: 600; color: var(--color-text); margin-bottom: 4px; }
    .card__handle { font-size: 0.875rem; color: var(--color-text-muted); }
    .card__link { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: transparent; border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--color-primary); font-size: 0.875rem; font-weight: 500; text-decoration: none; transition: background var(--transition), color var(--transition); }
    .card__link:hover, .card__link:focus-visible { background: var(--color-primary); color: #fff; }

    /* Footer */
    footer { background: var(--color-surface); border-top: 1px solid var(--color-border); padding: 32px 0; text-align: center; font-size: 0.875rem; color: var(--color-text-muted); }
    footer a { color: var(--color-primary); text-decoration: none; }
    footer a:hover, footer a:focus-visible { text-decoration: underline; }

    /* Accessibility */
    :focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; } }
  </style>
</head>
